spring.application.name=backend

# Render assigns the port at runtime via $PORT; fall back to 8080 for local dev.
server.port=${PORT:8080}

# HS256 signing secret for auth tokens; must be at least 32 bytes.
jwt.secret=${JWT_SECRET}

# Flyway owns the schema; Hibernate only maps to it.
spring.jpa.hibernate.ddl-auto=validate

# Keep the persistence context out of the view layer; load what handlers need explicitly.
spring.jpa.open-in-view=false

# Public base URL of the frontend, used to build links in outgoing email.
frontend.url=${FRONTEND_URL}

# Brevo transactional email.
brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=${BREVO_SENDER_EMAIL}

# Per-IP rate limiting on the unauthenticated /auth endpoints. On unless explicitly disabled.
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Google Gemini (AI Studio free tier) — chat assistant and weekly summary.
gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL}
# Read timeout for the Gemini call. Current "flash" models reason before replying, so a real
# prompt can take 20-40s; keep this comfortably above that.
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}


debug=true