# Test-only configuration. Mirrors src/main/resources/application.properties and
# supplies a throwaway jwt.secret so the context can start without JWT_SECRET set.
spring.application.name=backend
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

jwt.secret=insecure-test-signing-secret-not-used-in-any-real-environment

frontend.url=http://localhost:3000

# Throwaway SMTP config so the mail auto-configuration and context load without real
# credentials. Tests mock EmailService, so nothing actually connects.
spring.mail.host=smtp.example.test
spring.mail.port=587
spring.mail.username=test@weeklyreport.test
spring.mail.password=test-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=noreply@weeklyreport.test

gemini.api-key=test-gemini-api-key
gemini.model=gemini-test-model

# Off by default so the existing auth integration tests, which share one Spring context and
# therefore one bucket map, don't accumulate hits into the limiter. RateLimitIntegrationTest
# re-enables it for itself via @TestPropertySource.
rate-limit.enabled=false
